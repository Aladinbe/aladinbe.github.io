  { id:5, nom:'Canva', iconId:'canva', logo:'CV', fonction:'Création graphique', cat:'Création graphique', envs:['ecole','asbl','perso'], compte:'à compléter', notes:'', statut:'À garder', date:'21 août 2026' },
  { id:6, nom:'iLovePDF', iconId:'ilovepdf', logo:'iL', fonction:'PDF / Documents', cat:'PDF / Documents', envs:['ecole','asbl','perso'], compte:'à compléter', notes:'', statut:'À garder', date:'21 août 2026' },
  { id:7, nom:'Brainy', iconId:'brainy', logo:'BR', fonction:'Quiz / pédagogie', cat:'Quiz / pédagogie', envs:['ecole','asbl','perso'], compte:'à compléter', notes:'', statut:'À garder', date:'21 août 2026' },
  { id:8, nom:'NoteGPT', iconId:'notegpt', logo:'NG', fonction:'IA', cat:'IA', envs:['ecole','asbl','perso'], compte:'à compléter', notes:'', statut:'À garder', date:'21 août 2026' },
  { id:9, nom:'Meta AI', iconId:'metaai', logo:'M', fonction:'IA', cat:'IA', envs:['ecole','asbl','perso'], compte:'à compléter', notes:'', statut:'À garder', date:'21 août 2026' },
];

let activeEnv = null;
let favoris = JSON.parse(localStorage.getItem('portail-favoris') || '[]');
const envMap = Object.fromEntries(ENVIRONNEMENTS.map(e=>[e.id,e]));

function envDotsHTML(envs){ return envs.map(id=>`<span class="env-dot" style="background:${envMap[id].color}" title="${envMap[id].nom}"></span>`).join(''); }

function renderEnvGrid(){
  const grid = document.getElementById('env-grid');
  grid.innerHTML = ENVIRONNEMENTS.map(e=>{
    const count = OUTILS.filter(o=>o.envs.includes(e.id)).length;
    return `<div class="env-btn ${activeEnv===e.id?'active':''}" style="--c:${e.color}; --bg:${e.bg}" onclick="toggleEnv('${e.id}')">
      <span class="icon">${e.icon}</span>
      <div class="label-wrap"><h3>${e.nom}</h3><span class="count">${count} outil${count>1?'s':''}</span></div>
    </div>`;
  }).join('') + `<button class="add-btn" onclick="placeholderAdd('environnement')"><span class="plus">+</span> Ajouter un environnement</button>`;
  document.getElementById('env-status').textContent = activeEnv ? `Filtré : ${envMap[activeEnv].nom}` : 'Tous affichés';
  renderBreadcrumb();
}

function renderBreadcrumb(){
  const bc = document.getElementById('breadcrumb');
  if(!activeEnv){ bc.innerHTML = `<span class="current">Accueil</span>`; return; }
  bc.innerHTML = `<a onclick="toggleEnv('${activeEnv}')">Accueil</a><span class="sep">›</span><span class="current">${envMap[activeEnv].nom}</span>`;
}

function applyTint(){
  const bg = activeEnv ? envMap[activeEnv].bg : 'var(--paper)';
  document.body.style.background = bg;
  document.getElementById('env-sticky-wrap').style.background = bg;
}

function toggleEnv(id){
  activeEnv = activeEnv===id ? null : id;
  renderEnvGrid(); renderQuick(); renderTools(); applyTint();
}

function renderQuick(){
  const cle = activeEnv || 'accueil';
  document.getElementById('quick-row').innerHTML = ACCES_RAPIDES.map(q=>
    `<a class="quick-pill" href="${q.liens[cle]}" onclick="return false;">${renderLogo(q.iconId)} ${q.label}</a>`
  ).join('') + `<button class="add-btn add-quick" onclick="placeholderAdd('accès rapide')"><span class="plus">+</span> Ajouter</button>`;
}

function renderTools(){
  const search = document.getElementById('search').value.trim().toLowerCase();
  const container = document.getElementById('cat-container');
  container.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    let items = OUTILS.filter(o=>o.cat===cat);
    if(activeEnv) items = items.filter(o=>o.envs.includes(activeEnv));
    if(search) items = items.filter(o=>o.nom.toLowerCase().includes(search) || o.cat.toLowerCase().includes(search));
    if(items.length===0 && search) return;
    const block = document.createElement('div');
    block.className = 'cat-block';
    block.innerHTML = `
      <div class="cat-header" onclick="this.parentElement.classList.toggle('collapsed')">
        <div class="left"><span class="eyebrow">${cat} · ${items.length}</span></div>
        <span class="chev">▾</span>
      </div>
      <div class="tool-grid">
        ${items.map(o=>`
          <div class="tool-card" onclick="openModal(${o.id})">
            <span class="fav-star ${favoris.includes(o.id)?'active':''}" onclick="event.stopPropagation(); toggleFav(${o.id})">★</span>
            <div class="env-tags">${envDotsHTML(o.envs)}</div>
            <div class="tool-logo">${renderLogo(o.iconId, o.logo)}</div>
            <h4>${o.nom}</h4>
            <p>${o.fonction}</p>
          </div>`).join('')}
        <button class="add-tool-card" onclick="placeholderAdd('outil (${cat})')"><span class="plus">+</span> Ajouter un outil</button>
      </div>`;
    container.appendChild(block);
  });
  if(container.innerHTML==='') container.innerHTML = '<p style="color:var(--ink-soft); font-size:13.5px;">Aucun outil ne correspond à ce filtre.</p>';
}

function placeholderAdd(type){ alert(`Emplacement réservé pour ajouter un(e) ${type}.\n(La sauvegarde réelle sera branchée dans une prochaine étape.)`); }

function renderTestZone(){
  const items = OUTILS.filter(o=>o.statut==='À tester');
  document.getElementById('test-count').textContent = items.length ? `${items.length} en évaluation` : '';
  const grid = document.getElementById('test-grid');
  if(items.length===0){ grid.innerHTML = '<p style="color:var(--ink-soft); font-size:13.5px;">Aucun outil en cours de test pour l’instant.</p>'; return; }
  grid.innerHTML = items.map(o=>`
    <div class="test-card" onclick="openModal(${o.id})">
      <div class="row1"><div class="tool-logo" style="margin-bottom:0;">${o.logo}</div><span class="status-badge status-atester">À tester</span></div>
      <h4>${o.nom}</h4><p>${o.notes || o.fonction}</p>
    </div>`).join('');
}

const statusClass = { 'À tester':'status-atester', 'Testé':'status-teste', 'À garder':'status-garder', 'Abandonné':'status-abandonne' };

function openModal(id){
  const o = OUTILS.find(t=>t.id===id);
  document.getElementById('modal-content').innerHTML = `
    <div class="modal-close" onclick="closeModal()">✕</div>
    <div class="tool-logo">${renderLogo(o.iconId, o.logo)}</div>
    <h3>${o.nom}</h3><div class="fn">${o.fonction}</div>
    <div class="modal-row"><div class="eyebrow">Environnements</div><div class="modal-envs">${o.envs.map(id=>`<span class="env-chip" style="background:${envMap[id].bg}; color:${envMap[id].color}">${envMap[id].nom}</span>`).join('')}</div></div>
    <div class="modal-row"><div class="eyebrow">Compte utilisé</div><div class="val">${o.compte}</div></div>
    <div class="modal-row"><div class="eyebrow">Statut</div><div class="val"><span class="status-badge ${statusClass[o.statut]}">${o.statut}</span></div></div>
    <div class="modal-row"><div class="eyebrow">Dernier test</div><div class="val">${o.date}</div></div>
    ${o.notes ? `<div class="modal-row"><div class="eyebrow">Notes</div><div class="val">${o.notes}</div></div>` : ''}
    <a href="#" class="open-btn" onclick="return false;">Ouvrir ${o.nom} →</a>
  `;
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
document.getElementById('search').addEventListener('input', renderTools);

renderEnvGrid(); renderQuick(); renderTools(); renderTestZone(); applyTint();

function toggleFav(id){
  favoris = favoris.includes(id) ? favoris.filter(f=>f!==id) : [...favoris, id];
  localStorage.setItem('portail-favoris', JSON.stringify(favoris));
  renderTools();
}

function toggleDark(){
  document.body.classList.toggle('dark');
  document.getElementById('dark-toggle').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
  localStorage.setItem('portail-dark', document.body.classList.contains('dark') ? '1' : '0');
}
if(localStorage.getItem('portail-dark') === '1'){ toggleDark(); }

let inactivityTimer; let savedScroll = 0;
function scheduleLock(){ clearTimeout(inactivityTimer); inactivityTimer = setTimeout(lockNow, 5 * 60 * 1000); }
function lockNow(){ savedScroll = window.scrollY; document.getElementById('lock-screen').classList.add('open'); }
function unlock(){ document.getElementById('lock-screen').classList.remove('open'); window.scrollTo(0, savedScroll); scheduleLock(); }
['mousemove','keydown','click','scroll','touchstart'].forEach(evt=> document.addEventListener(evt, () => { if(!document.getElementById('lock-screen').classList.contains('open')) scheduleLock(); }));
scheduleLock();
</script>
